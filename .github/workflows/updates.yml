name: Updates

on:
  # every month
  schedule:
    - cron: '14 3 1 * *'
  # on demand
  workflow_dispatch:

jobs:
  pre-commit:
    name: "Update pre-commit hooks and run them on all files"
    runs-on: ubuntu-ghcloud
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # pin@v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pin@v5
        with:
          python-version: '3.12'
      - run: rustup update stable
      - run: sudo apt-get install protobuf-compiler
      - run: cargo install cargo-sort@2.0.1
      - run: cargo install --locked cargo-deny@0.18.4
      - run: pip install pre-commit
      - run: pre-commit autoupdate
      - run: pre-commit run --all-files
      - uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # pin@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-pre-commit-hooks
          title: "chore: update pre-commit hooks"
          commit-message: "chore: update pre-commit hooks"
          body: Update pre-commit hooks to latest version.
